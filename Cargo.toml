[package]
name = "bluegit"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
colored = "2"
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
rustyline = "14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[bin]]
name = "bluegit"
path = "src/main.rs"
